[package]
name = "wtfs-vfs"
version.workspace = true
edition.workspace = true

[dependencies]
blake3.workspace = true
crossbeam-channel.workspace = true
dashmap.workspace = true
lru.workspace = true
parking_lot.workspace = true
tracing.workspace = true
winfsp.workspace = true
winfsp-sys.workspace = true
# Win32_Security(_Authorization)：固定安全描述符经 SDDL 一次性转换；
# Win32_Storage_FileSystem：GetDiskFreeSpaceExW（卷容量）。
windows = { workspace = true, features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
wtfs-core = { path = "../wtfs-core" }
# M18/B180100：CAS 后端（C 方案）与 B1 Overlay 共用 WinFSP 回调层。
wtfs-cas = { path = "../wtfs-cas" }

[dev-dependencies]
tempfile.workspace = true
